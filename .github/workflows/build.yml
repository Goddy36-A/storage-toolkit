name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: build
        run: gradle assembleDebug --no-daemon 2>&1 | tee build_output.log
        continue-on-error: true

      - name: Publish diagnostics to repo
        if: always()
        run: |
          {
            echo "=== BUILD OUTCOME: ${{ steps.build.outcome }} ==="
            echo "=== LAST 400 LINES OF BUILD LOG ==="
            tail -n 400 build_output.log
            echo ""
            echo "=== APK OUTPUT FILES ==="
            find app/build/outputs -type f 2>&1 || echo "outputs dir not found"
          } > ci_diagnostics.log

          CONTENT_B64=$(base64 -w0 ci_diagnostics.log)
          SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/ci_diagnostics.log?ref=main" \
            | jq -r '.sha // empty')

          if [ -n "$SHA" ]; then
            curl -s -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/ci_diagnostics.log" \
              -d "$(jq -n --arg content "$CONTENT_B64" --arg sha "$SHA" '{message:"Update CI diagnostics",content:$content,branch:"main",sha:$sha}')"
          else
            curl -s -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/ci_diagnostics.log" \
              -d "$(jq -n --arg content "$CONTENT_B64" '{message:"Add CI diagnostics",content:$content,branch:"main"}')"
          fi

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: storage-toolkit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
